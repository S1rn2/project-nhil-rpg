name: Build Nhil RPG Mod with AI

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Instructions for the AI agent'
        required: true
        default: >
          Run ./gradlew build to check for any compiler errors in the new Java files and fix them.
          Then write and run a short Python script to generate all remaining missing JSON files
          (item models, armor/weapon recipes, loot tables, and en_us.json translations) for
          NhilWeapons, NhilGear, NhilBosses, and NhilWorldgen. Delete the temporary Python script
          when done, then run ./gradlew build until it succeeds cleanly.

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run AI Coding Agent (Gemini 2.5 Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install -g @google/gemini-cli
          gemini -m gemini-2.5-flash -y -p "${{ github.event.inputs.task_prompt }}"

      - name: Final Gradle Build Verification
        run: ./gradlew build

      - name: Commit and Push AI Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git diff --staged --quiet || git commit -m "Complete mod features and JSON assets via Gemini"
          git push

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: project-nhil-rpg-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
