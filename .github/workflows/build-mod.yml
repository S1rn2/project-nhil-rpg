name: Build Nhil RPG Mod with AI

on:
  workflow_dispatch:
    inputs:
      run_ai_agent:
        description: 'Run AI agent to generate missing JSON assets? (true/false)'
        required: true
        default: 'true'
      task_prompt:
        description: 'Instructions for the AI agent'
        required: true
        default: >
          Inspect the Java files in src/main/java to see what items, blocks, and entities exist,
          and compare against src/main/resources. Write and run ONE short Python script to generate
          any missing item models, blockstates, recipes, loot tables, or en_us.json entries, then
          delete the Python script. Do NOT run ./gradlew build inside this step.

permissions:
  contents: write
  models: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract mod project
        id: find-mod
        run: |
          if [ ! -f "gradlew" ] && [ ! -f "ProjectNhil-ThrowingDiscs/gradlew" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -q -o "$ZIP_FILE"
            fi
          fi

          if [ -f "ProjectNhil-ThrowingDiscs/gradlew" ]; then
            echo "dir=ProjectNhil-ThrowingDiscs" >> $GITHUB_OUTPUT
          elif [ -f "gradlew" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "Error: Could not find gradlew anywhere in repository:"
            ls -la
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ${{ steps.find-mod.outputs.dir }}
        run: chmod +x gradlew

      - name: Run AI Coding Agent (GitHub Models)
        if: ${{ github.event.inputs.run_ai_agent == 'true' }}
        timeout-minutes: 6
        working-directory: ${{ steps.find-mod.outputs.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g --allow-scripts=opencode-ai opencode-ai
          cat << 'EOF' > opencode.json
          {
            "$schema": "https://opencode.ai",
            "agent": {
              "build": {
                "steps": 15
              }
            },
            "provider": {
              "github-models": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "GitHub Models",
                "options": {
                  "baseURL": "https://azure.com",
                  "apiKey": "{env:GITHUB_TOKEN}"
                },
                "models": {
                  "gpt-4.1-mini": {
                    "name": "GPT-4.1 Mini"
                  }
                }
              }
            }
          }
          EOF
          opencode run -m github-models/gpt-4.1-mini "${{ github.event.inputs.task_prompt }}" || echo "AI step finished or hit step limit, continuing to build..."
          rm -f opencode.json

      - name: Final Gradle Build Verification
        working-directory: ${{ steps.find-mod.outputs.dir }}
        run: ./gradlew build

      - name: Commit and Push AI Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git diff --staged --quiet || git commit -m "Complete mod features and JSON assets"
          git push

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: project-nhil-rpg-mod
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
