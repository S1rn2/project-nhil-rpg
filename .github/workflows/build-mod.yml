name: Build Nhil RPG Mod with AI

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Instructions for the AI agent'
        required: true
        default: >
          1. Inspect the Java files for NhilWeapons, NhilGear, NhilBosses, and NhilWorldgen.
          2. Write and run a short Python script to generate all missing JSON files (item models,
          armor/weapon recipes, loot tables, and en_us.json translations), then delete the script.
          3. Run `gradle build` once to check for compiler errors, fix any issues found, and
          verify `gradle build` passes. Do not repeat failing commands more than twice.

permissions:
  contents: write
  models: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Run AI Coding Agent (GitHub Models)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g --allow-scripts=opencode-ai opencode-ai
          cat << 'EOF' > opencode.json
          {
            "$schema": "https://opencode.ai",
            "agent": {
              "build": {
                "steps": 40
              }
            },
            "provider": {
              "github-models": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "GitHub Models",
                "options": {
                  "baseURL": "https://azure.com",
                  "apiKey": "{env:GITHUB_TOKEN}"
                },
                "models": {
                  "gpt-4.1": {
                    "name": "GPT-4.1"
                  }
                }
              }
            }
          }
          EOF
          opencode run -m github-models/gpt-4.1 "${{ github.event.inputs.task_prompt }}"
          rm -f opencode.json

      - name: Final Gradle Build Verification
        run: gradle build

      - name: Commit and Push AI Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git diff --staged --quiet || git commit -m "Complete mod features and JSON assets"
          git push

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: project-nhil-rpg-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
